spring:
  application:
    name: api
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:digisec}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-override-me-with-32-bytes!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  seed-admin: ${SEED_ADMIN:true}
  admin:
    email: ${ADMIN_EMAIL:admin@digisec.local}
    password: ${ADMIN_PASSWORD:ChangeMe123!}
  mail:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  storage:
    location: ${STORAGE_LOCATION:./uploads}
