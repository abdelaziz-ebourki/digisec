name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API — Spring Boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: rootpw
          MARIADB_DATABASE: digisec
          MARIADB_USER: digisec
          MARIADB_PASSWORD: digisec
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify (tests + build)
        working-directory: api
        env:
          DB_USERNAME: digisec
          DB_PASSWORD: digisec
          JWT_SECRET: ci-secret-key-with-at-least-32-characters!!
          SEED_ADMIN: 'true'
        run: ./mvnw -B verify

  ui:
    name: UI — React
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test

  a11y:
    name: A11y — axe + contrast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI deps
        working-directory: ui
        run: npm ci
      - name: Unit a11y (jest-axe + contrast)
        working-directory: ui
        run: npm test -- src/test/a11y.test.tsx src/test/contrast.test.ts

  e2e-a11y:
    name: E2E — a11y & visual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: rootpw
          MARIADB_DATABASE: digisec
          MARIADB_USER: digisec
          MARIADB_PASSWORD: digisec
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            e2e/package-lock.json
      - name: Install UI deps
        working-directory: ui
        run: npm ci
      - name: Install E2E deps
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Build UI
        working-directory: ui
        run: npm run build
      - name: Build API
        working-directory: api
        env:
          DB_USERNAME: digisec
          DB_PASSWORD: digisec
          JWT_SECRET: ci-secret-key-with-at-least-32-characters!!
          SEED_ADMIN: 'true'
        run: ./mvnw -B -DskipTests package
      - name: Run a11y specs
        working-directory: e2e
        env:
          DB_USERNAME: digisec
          DB_PASSWORD: digisec
          JWT_SECRET: ci-secret-key-with-at-least-32-characters!!
          SEED_ADMIN: 'true'
        run: npx playwright test a11y.spec.ts
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: e2e/.artifacts
          if-no-files-found: warn
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
