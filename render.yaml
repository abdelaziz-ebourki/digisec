# Render blueprint — DIGISEC backend (free tier, demo).
#
# Topology:
#   digisec-db  private service, MariaDB 11.8, EPHEMERAL (no disk on free tier:
#               all data is lost on restart/redeploy — demo only).
#   digisec-api public Docker web service (Java 25 image built from ./api),
#               health check GET /actuator/health.
#
# Frontend lives on Vercel and calls the api service URL directly, so the
# backend MUST set CORS_ALLOWED_ORIGINS + FRONTEND_URL to the Vercel URL,
# and Vercel MUST set VITE_API_URL=https://<digisec-api>/api/v1
# (see ui/src/services/api.ts).
#
# First boot: SEED_ADMIN=true creates the admin, then flip it to false and
# rotate ADMIN_PASSWORD. Real SMTP_* values are required or registration
# emails fail (registration still returns 201, but users can't verify).

services:
  - type: pserv
    name: digisec-db
    runtime: image
    image:
      url: mariadb:11.8
    plan: free
    envVars:
      - key: MARIADB_ROOT_PASSWORD
        generateValue: true
      - key: MARIADB_DATABASE
        value: digisec
      - key: MARIADB_USER
        value: digisec
      - key: MARIADB_PASSWORD
        generateValue: true

  - type: web
    name: digisec-api
    runtime: docker
    plan: free
    dockerContext: ./api
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Private-service hostname as assigned by Render; confirm in the
      # digisec-db dashboard (internal address, port 3306).
      - key: DB_HOST
        value: digisec-db
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: digisec
      - key: DB_USERNAME
        value: digisec
      # Copy the generated MARIADB_PASSWORD from the digisec-db service.
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Exact Vercel origin, e.g. https://digisec.vercel.app (no trailing /).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SEED_ADMIN
        value: 'true'
      - key: ADMIN_EMAIL
        value: admin@digisec.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORAGE_LOCATION
        value: /tmp/uploads
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
